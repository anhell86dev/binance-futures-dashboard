<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Ideas Journal V1.1</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root { --bg-primary: #0f0f1e; --bg-secondary: #1a1a2e; --bg-card: #16213e; --accent-primary: #f0b90b; --success: #00c853; --text-primary: #eaeaea; --text-secondary: #a0a0a0; --border-color: #0f3460; --radius: 10px; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { background: var(--bg-secondary); border-radius: var(--radius); padding: 20px 30px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    .header h1 { color: var(--accent-primary); margin-bottom: 10px; }
    .version-tag { background: var(--info); color: white; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; margin-left: 10px; }
    .form-section { background: var(--bg-secondary); border-radius: var(--radius); padding: 25px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-weight: 600; color: var(--text-secondary); font-size: 0.9rem; }
    .form-group input, .form-group select { padding: 12px 15px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); }
    .star-rating { display: flex; gap: 5px; direction: rtl; justify-content: flex-end; }
    .star-rating input { display: none; }
    .star-rating label { font-size: 2rem; color: var(--bg-card); cursor: pointer; }
    .star-rating label:hover, .star-rating label:hover ~ label { color: var(--accent-primary); }
    .star-rating input:checked ~ label { color: var(--accent-primary); }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-save { background: var(--success); color: white; }
    .btn-export { background: var(--info); color: white; }
    .table-section { background: var(--bg-secondary); border-radius: var(--radius); padding: 25px; border: 1px solid var(--border-color); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { background: var(--bg-card); color: var(--accent-primary); padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border-color); }
    .data-table td { padding: 12px; border-bottom: 1px solid var(--border-color); color: var(--text-secondary); }
    .stars { color: var(--accent-primary); font-size: 1.2rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 Trading Ideas Journal <span class="version-tag">V1.1</span></h1>
    </div>
    <div class="form-section">
      <h2 style="color: var(--accent-primary); margin-bottom: 20px;">Nueva Idea</h2>
      <form id="ideasForm">
        <div class="form-grid">
          <div class="form-group"><label>Fecha</label><input type="datetime-local" id="fecha" required></div>
          <div class="form-group"><label>Activo</label><input type="text" id="activo" placeholder="BTCUSDT" required></div>
          <div class="form-group"><label>Setup</label><select id="setup" required><option value="">Seleccionar...</option><option value="Breakout">Breakout</option><option value="Pullback">Pullback</option><option value="Reversal">Reversal</option></select></div>
          <div class="form-group"><label>Zona de entrada</label><input type="text" id="zonaEntrada" placeholder="42,000 - 42,200" required></div>
          <div class="form-group"><label>Stop Loss</label><input type="number" id="stopLoss" placeholder="41,500" step="0.01" required></div>
          <div class="form-group"><label>TP1</label><input type="number" id="tp1" placeholder="42,800" step="0.01" required></div>
          <div class="form-group"><label>TP2</label><input type="number" id="tp2" placeholder="43,200" step="0.01"></div>
          <div class="form-group"><label>TP3</label><input type="number" id="tp3" placeholder="43,800" step="0.01"></div>
          <div class="form-group"><label>Tendencia</label><select id="tendencia" required><option value="">Seleccionar...</option><option value="Alcista">Alcista</option><option value="Bajista">Bajista</option><option value="Lateral">Lateral</option></select></div>
          <div class="form-group"><label>RSI(14)</label><input type="number" id="rsi" placeholder="58.5" step="0.1" min="0" max="100"></div>
          <div class="form-group"><label>Calidad (1-5 estrellas)</label><div class="star-rating"><input type="radio" id="star5" name="calidad" value="5" required><label for="star5">★</label><input type="radio" id="star4" name="calidad" value="4"><label for="star4">★</label><input type="radio" id="star3" name="calidad" value="3"><label for="star3">★</label><input type="radio" id="star2" name="calidad" value="2"><label for="star2">★</label><input type="radio" id="star1" name="calidad" value="1"><label for="star1">★</label></div></div>
          <div class="form-group"><label>Sesgo Institucional</label><select id="sesgo" required><option value="">Seleccionar...</option><option value="Long">Long</option><option value="Short">Short</option><option value="Neutral">Neutral</option></select></div>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn" onclick="clearForm()" style="background: var(--text-secondary);">🧹 Limpiar</button>
          <button type="submit" class="btn btn-save">💾 Guardar</button>
          <button type="button" class="btn btn-export" onclick="exportToCSV()">📊 Exportar CSV</button>
        </div>
      </form>
    </div>
    <div class="table-section">
      <h2 style="color: var(--accent-primary); margin-bottom: 20px;">Ideas Guardadas</h2>
      <table class="data-table" id="ideasTable">
        <thead><tr><th>Fecha</th><th>Activo</th><th>Setup</th><th>Zona Entrada</th><th>SL</th><th>TP1</th><th>TP2</th><th>TP3</th><th>Tendencia</th><th>RSI</th><th>Calidad</th><th>Sesgo</th></tr></thead>
        <tbody id="ideasBody"></tbody>
      </table>
    </div>
  </div>
  <script>
    let ideas = [];
    document.getElementById('fecha').value = new Date().toISOString().slice(0, 16);
    loadIdeas();
    document.getElementById('ideasForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const idea = {
        id: Date.now(), fecha: document.getElementById('fecha').value, activo: document.getElementById('activo').value.toUpperCase(),
        setup: document.getElementById('setup').value, zonaEntrada: document.getElementById('zonaEntrada').value,
        stopLoss: parseFloat(document.getElementById('stopLoss').value) || 0, tp1: parseFloat(document.getElementById('tp1').value) || 0,
        tp2: parseFloat(document.getElementById('tp2').value) || 0, tp3: parseFloat(document.getElementById('tp3').value) || 0,
        tendencia: document.getElementById('tendencia').value, rsi: parseFloat(document.getElementById('rsi').value) || 0,
        calidad: parseInt(document.querySelector('input[name="calidad"]:checked').value), sesgo: document.getElementById('sesgo').value
      };
      ideas.unshift(idea);
      localStorage.setItem('trading_ideas', JSON.stringify(ideas));
      renderIdeas();
      clearForm();
      alert('✅ Idea guardada');
    });
    function clearForm() { document.getElementById('ideasForm').reset(); document.getElementById('fecha').value = new Date().toISOString().slice(0, 16); }
    function loadIdeas() { const saved = localStorage.getItem('trading_ideas'); if (saved) { ideas = JSON.parse(saved); renderIdeas(); } }
    function renderIdeas() {
      const tbody = document.getElementById('ideasBody');
      tbody.innerHTML = '';
      ideas.forEach(idea => {
        const tr = document.createElement('tr');
        const stars = '★'.repeat(idea.calidad) + '☆'.repeat(5 - idea.calidad);
        tr.innerHTML = `<td>${new Date(idea.fecha).toLocaleString()}</td><td style="font-weight:bold;color:var(--accent-primary)">${idea.activo}</td><td>${idea.setup}</td><td>${idea.zonaEntrada}</td><td>${idea.stopLoss}</td><td>${idea.tp1}</td><td>${idea.tp2 || '-'}</td><td>${idea.tp3 || '-'}</td><td>${idea.tendencia}</td><td>${idea.rsi || '-'}</td><td><span class="stars">${stars}</span></td><td>${idea.sesgo}</td>`;
        tbody.appendChild(tr);
      });
    }
    function exportToCSV() {
      const headers = ['Fecha','Activo','Setup','Zona Entrada','Stop Loss','TP1','TP2','TP3','Tendencia','RSI','Calidad','Sesgo'];
      const rows = ideas.map(i => [i.fecha,i.activo,i.setup,i.zonaEntrada,i.stopLoss,i.tp1,i.tp2||'',i.tp3||'',i.tendencia,i.rsi||'',i.calidad,i.sesgo]);
      const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csv], {type: 'text/csv'});
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `trading_ideas_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      alert('✅ Ideas exportadas a CSV');
    }
  </script>
</body>
</html>
